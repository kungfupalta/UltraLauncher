name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Descomprimir UltraLauncher.zip
        run: unzip -o -q UltraLauncher.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (licencias y plataforma 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          else
            echo "sdkmanager no encontrado; se usa el SDK del runner tal cual."
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar debug
        working-directory: UltraLauncher
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Resumen de errores de compilación
        if: failure()
        working-directory: UltraLauncher
        run: grep -E "^e: |What went wrong" -A2 build.log | head -100 || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraLauncher-debug
          path: UltraLauncher/app/build/outputs/apk/debug/*.apk
